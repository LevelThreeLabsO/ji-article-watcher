name: JI article watcher

on:
  # Pinged every ~2 min by cron-job.org via the workflow_dispatch API.
  workflow_dispatch:
  # Laggy best-effort fallback if the pinger ever stops.
  schedule:
    - cron: "*/5 * * * *"

# Needed so poll.py can commit the updated state file back to the repo.
permissions:
  contents: write
  actions: write   # lets the Kickoff step below start kickoff.yml

# One run at a time. poll.py also re-checks the state per-article, so even if two
# runs overlap they won't post the same article twice.
concurrency:
  group: poll
  cancel-in-progress: false

jobs:
  poll:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 poll.py
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          JI_BYPASS_TOKEN: ${{ secrets.JI_BYPASS_TOKEN }}
      # Weekday mornings 6:30-10am ET: start the Kickoff WhatsApp job once a day
      # (kickoff.yml). GitHub's own schedule for it was hours late or skipped.
      # One quick API call per run in that window; never blocks the watcher.
      - name: Start Kickoff WhatsApp job
        if: always()
        continue-on-error: true
        timeout-minutes: 1
        env:
          GH_TOKEN: ${{ github.token }}
          TZ: America/New_York
        run: |
          [ "$(date +%u)" -le 5 ] || exit 0
          hm=$(date +%H%M)
          { [ "$hm" -ge 630 ] && [ "$hm" -lt 1000 ]; } || exit 0
          today=$(date +%F)
          n=$(gh run list -R "$GITHUB_REPOSITORY" --workflow kickoff.yml --limit 5 \
                --json createdAt -q "[.[] | select(.createdAt | fromdateiso8601 | strflocaltime(\"%F\") == \"$today\")] | length")
          if [ "${n:-1}" -eq 0 ]; then
            gh workflow run kickoff.yml -R "$GITHUB_REPOSITORY" --ref main
            echo "Started today's Kickoff job."
          fi
      # Piggyback ping to ji-www-watcher so it fires every ~1 min.
      # Safety against dispatch storms (like 2026-08-06 GH outage): skip if the
      # WWW watcher already has >=3 queued or in-progress runs. That prevents us
      # from piling up dispatches when GitHub can't process them.
      # continue-on-error: article-watcher stays green if trigger fails.
      - name: Trigger WWW watcher (immediate)
        continue-on-error: true
        timeout-minutes: 1
        env:
          GH_TOKEN: ${{ secrets.WWW_WATCHER_PAT }}
        run: |
          backlog=$(gh run list -R LevelThreeLabsO/ji-www-watcher \
                     --workflow poll.yml --limit 10 \
                     --json status -q '[.[] | select(.status=="queued" or .status=="in_progress")] | length')
          if [ "${backlog:-0}" -ge 3 ]; then
            echo "WWW watcher backlog is $backlog — skipping dispatch to avoid pileup."
            exit 0
          fi
          gh workflow run poll.yml -R LevelThreeLabsO/ji-www-watcher --ref main

      - name: Trigger WWW watcher (+60s)
        continue-on-error: true
        timeout-minutes: 2
        env:
          GH_TOKEN: ${{ secrets.WWW_WATCHER_PAT }}
        run: |
          sleep 60
          backlog=$(gh run list -R LevelThreeLabsO/ji-www-watcher \
                     --workflow poll.yml --limit 10 \
                     --json status -q '[.[] | select(.status=="queued" or .status=="in_progress")] | length')
          if [ "${backlog:-0}" -ge 3 ]; then
            echo "WWW watcher backlog is $backlog — skipping dispatch to avoid pileup."
            exit 0
          fi
          gh workflow run poll.yml -R LevelThreeLabsO/ji-www-watcher --ref main

      # Cadence health check: article-watcher runs every ~2 min like clockwork,
      # so it's a natural heartbeat to notice if WWW watcher goes quiet.
      # Fires ONCE per outage: alerts when gap first crosses 10 min, then stays
      # quiet until this watcher sees that gap drop back under 10 min at least
      # once (meaning WWW recovered). Prevents the "every 10 min" spam that
      # happened during GitHub's own degraded-runners periods.
      # Cadence alert disabled 2026-11-04 at user request — too noisy during
      # GH Actions degradation. If you want it back, restore from the prior
      # commit (search git log for "Alert if WWW cadence").
      - name: Cadence alert (disabled)
        if: false
        run: echo "cadence alert disabled"
