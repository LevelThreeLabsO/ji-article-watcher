name: JI article watcher

on:
  # Pinged every ~2 min by cron-job.org via the workflow_dispatch API.
  workflow_dispatch:
  # Laggy best-effort fallback if the pinger ever stops.
  schedule:
    - cron: "*/5 * * * *"

# Needed so poll.py can commit the updated state file back to the repo.
permissions:
  contents: write

# One run at a time. poll.py also re-checks the state per-article, so even if two
# runs overlap they won't post the same article twice.
concurrency:
  group: poll
  cancel-in-progress: false

jobs:
  poll:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 poll.py
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          JI_BYPASS_TOKEN: ${{ secrets.JI_BYPASS_TOKEN }}
      # Piggyback ping to ji-www-watcher so it fires every ~1 min.
      # Safety against dispatch storms (like 2026-08-06 GH outage): skip if the
      # WWW watcher already has >=3 queued or in-progress runs. That prevents us
      # from piling up dispatches when GitHub can't process them.
      # continue-on-error: article-watcher stays green if trigger fails.
      - name: Trigger WWW watcher (immediate)
        continue-on-error: true
        timeout-minutes: 1
        env:
          GH_TOKEN: ${{ secrets.WWW_WATCHER_PAT }}
        run: |
          backlog=$(gh run list -R LevelThreeLabsO/ji-www-watcher \
                     --workflow poll.yml --limit 10 \
                     --json status -q '[.[] | select(.status=="queued" or .status=="in_progress")] | length')
          if [ "${backlog:-0}" -ge 3 ]; then
            echo "WWW watcher backlog is $backlog — skipping dispatch to avoid pileup."
            exit 0
          fi
          gh workflow run poll.yml -R LevelThreeLabsO/ji-www-watcher --ref main

      - name: Trigger WWW watcher (+60s)
        continue-on-error: true
        timeout-minutes: 2
        env:
          GH_TOKEN: ${{ secrets.WWW_WATCHER_PAT }}
        run: |
          sleep 60
          backlog=$(gh run list -R LevelThreeLabsO/ji-www-watcher \
                     --workflow poll.yml --limit 10 \
                     --json status -q '[.[] | select(.status=="queued" or .status=="in_progress")] | length')
          if [ "${backlog:-0}" -ge 3 ]; then
            echo "WWW watcher backlog is $backlog — skipping dispatch to avoid pileup."
            exit 0
          fi
          gh workflow run poll.yml -R LevelThreeLabsO/ji-www-watcher --ref main

      # Cadence health check: article-watcher runs every ~2 min like clockwork,
      # so it's a natural heartbeat to notice if WWW watcher goes quiet. If the
      # last successful WWW run was between 10 and 12 min ago, ping Slack ONCE
      # (the 2-min alert window means only one article-watcher run will fire it
      # per outage, no spam). Silence beyond that = we've already alerted.
      - name: Alert if WWW cadence has dropped
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.WWW_WATCHER_PAT }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: |
          last_success=$(gh run list -R LevelThreeLabsO/ji-www-watcher \
                          --workflow poll.yml --status success --limit 1 \
                          --json createdAt -q '.[0].createdAt')
          if [ -z "$last_success" ]; then exit 0; fi
          gap=$(python3 -c "
          from datetime import datetime, timezone
          ts = datetime.fromisoformat('$last_success'.replace('Z','+00:00'))
          print(int((datetime.now(timezone.utc) - ts).total_seconds() // 60))
          ")
          echo "Last WWW success was $gap minutes ago."
          if [ "$gap" -ge 10 ] && [ "$gap" -lt 12 ]; then
            curl -sS -X POST -H 'Content-Type: application/json' \
              --data "{\"username\":\"LB Watcher\",\"text\":\":warning: *LB Watcher: no successful WWW run in ${gap} minutes.* Should be running every ~1 min — something's up. Check https://github.com/LevelThreeLabsO/ji-www-watcher/actions\"}" \
              "$SLACK_WEBHOOK_URL" || true
          fi
